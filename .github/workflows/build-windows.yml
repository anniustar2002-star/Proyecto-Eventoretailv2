name: Compilar GS1 Market para Windows

# Se ejecuta a mano: pestaña Actions > "Compilar GS1 Market para Windows" > Run workflow
on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gs1-market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gs1-market/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Instalador (NSIS) y versión portátil (zip). En Windows sí se puede incrustar el icono en el .exe.
      - run: npx electron-builder --win nsis zip --x64 -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sin firma de código
      - uses: actions/upload-artifact@v4
        with:
          name: GS1-Market-Windows
          path: |
            gs1-market/release/*.exe
            gs1-market/release/*.zip
          if-no-files-found: error
