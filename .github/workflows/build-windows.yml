name: Compilar GS1 Market para Windows

# Se ejecuta a mano: pestaña Actions > "Compilar GS1 Market para Windows" > Run workflow.
# Genera dos archivos .exe y los publica en la sección Releases del repositorio para descargarlos directamente:
#  - GS1-Market-Setup-<versión>.exe     (instalador)
#  - GS1-Market-Portable-<versión>.exe  (un solo .exe que se ejecuta sin instalar)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gs1-market
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gs1-market/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # En Windows sí se puede incrustar el icono en el .exe
      - run: npx electron-builder --win nsis portable --x64 -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false" # sin firma de código
      - uses: actions/upload-artifact@v4
        with:
          name: GS1-Market-Windows
          path: gs1-market/release/*.exe
          if-no-files-found: error
      - name: Publicar los .exe en Releases
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" release/*.exe \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "GS1 Market $VERSION (compilación ${{ github.run_number }})" \
            --notes "Instalador y versión portátil de GS1 Market para Windows (64 bits). La app no está firmada: si Windows muestra un aviso azul, pulsa 'Más información' y luego 'Ejecutar de todas formas'."
