### 4. Lógica de Audio y Efectos Especiales (Web Audio API)

Para evitar dependencias pesadas de audio en assets externos, se implementa mediante síntesis pura:

```javascript
// Beep oficial de escaneo de alta velocidad (880Hz -> 1760Hz rápido)
function playScannerBeep(type = 'success') {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  
  osc.connect(gain);
  gain.connect(ctx.destination);
  
  if (type === 'success') {
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1400, ctx.currentTime);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
    osc.start();
    osc.stop(ctx.currentTime + 0.08);
  } else if (type === 'error') {
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(250, ctx.currentTime);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
    osc.start();
    osc.stop(ctx.currentTime + 0.25);
  }
}
```

### 6. Integración con Hardware Físico (Lectores de Código de Barras USB / BLE)

Para que funcione en el evento de Caracas con pistolas lectoras reales (Honeywell, Zebra, Datalogic):
- Las pistolas de código de barras funcionan en modo **HID (Human Interface Device / Emulación de Teclado)**.
- Se escucha el evento global `window.addEventListener('keydown', ...)` acumulando los caracteres hasta recibir un `Enter` (código ASCII 13).
- Al detectar la cadena GTIN (13 dígitos) o QR GS1 Digital Link, se dispara automáticamente la validación del SKU correspondiente sin necesidad de hacer clic manual con el mouse.
